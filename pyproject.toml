[project]
name = "iphoto"
version = "0.2.0a1"
description = "Archive old/large videos from Apple Photos to external storage"
requires-python = ">=3.10"
dependencies = [
    "osxphotos>=0.68.0",
    "photoscript>=0.3.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.scripts]
iphoto = "iphoto.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iphoto"]
